name: Phase 0 source checks

on:
  push:
    branches: [Sai-Branch]
  pull_request:
    branches: [Sai-Branch, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  community-and-commerce:
    name: Community and commerce source contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:community
      - run: npm run typecheck:community
      - run: npm run test:commerce
      - run: npm run typecheck:commerce
      - run: npm run typecheck:payments
      - run: npm run typecheck:fulfilment
      - run: npm run typecheck:refunds
      - run: npm run lint:commerce
      - run: npm run test:wallet
      - run: npm run typecheck:wallet
      - run: npm run lint:wallet

  doctor-directory:
    name: Doctor directory contracts and interface
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:directory
      - run: npm run typecheck:directory
      - run: npm run lint:directory

  account-role-boundary:
    name: Account source and isolated PostgreSQL candidates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:phase1
      - run: npm run typecheck:accounts
      - run: npm run lint:phase1
      - run: npm run typecheck:access
      - run: npm run lint:access
      - run: npm run progress:check

  preview-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:phase0
      - run: npm run test:hosting
      - run: npm run check:functions
      - run: npm run lint:phase0
      - run: npm run typecheck:preview
      - run: npm test

  application-typecheck:
    name: Full application typecheck (existing debt remains visible)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run schema:check
      - run: npm run typecheck:app

  config-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck:config

  production-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build

  dependency-advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm audit --audit-level=high
